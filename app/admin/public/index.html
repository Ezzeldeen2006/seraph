<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Seraph — party control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237a5cff'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' text-anchor='middle' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gateForm">
    <div class="brand"><span class="sigil">✦</span><div><b class="name">Seraph</b><small>party control</small></div></div>
    <label>Password<input id="pw" type="password" autocomplete="current-password" autofocus></label>
    <button class="primary" type="submit">Sign in</button>
    <p id="gateErr" class="err"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="rail">
    <div class="brand"><span class="sigil">✦</span><div><b class="name">Seraph</b><small id="host">party control</small></div></div>
    <nav id="roster" class="roster"></nav>
    <div class="rail-foot">
      <div id="uptime" class="uptime"></div>
      <button id="signout" class="quiet sm">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toasts" class="toasts"></div>
<div id="veil" class="veil" hidden><div class="dialog" id="dialog"></div></div>
<script src="app.js"></script>
</body>
</html>
